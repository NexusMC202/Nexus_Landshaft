plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        nexus_landscape {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('regionalFieldTest', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic and coverage checks for V2 regional field math.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nexusmc.landscape.worldgen.v2.field.RegionalFieldMathSelfTest'
}

tasks.register('stage6SurfaceTest', JavaExec) {
    group = 'verification'
    description = 'Checks all 53 Stage 6 surface profiles and pure selection rules.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nexusmc.landscape.worldgen.v2.surface.SurfaceProfileSelfTest'
}

tasks.register('stage6VegetationTest', JavaExec) {
    group = 'verification'
    description = 'Checks all 53 Stage 6 vegetation profiles and exclusions.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nexusmc.landscape.worldgen.v2.vegetation.VegetationProfileSelfTest'
}

tasks.register('stage6CommandTest', JavaExec) {
    group = 'verification'
    description = 'Checks Stage 6 debug command registration and permission policy.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nexusmc.landscape.command.Stage6CommandPolicySelfTest'
}

tasks.register('boundedCacheTest', JavaExec) {
    group = 'verification'
    description = 'Checks strict cache capacity and concurrent clear/write behavior.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nexusmc.landscape.worldgen.v2.util.BoundedConcurrentCacheSelfTest'
}

tasks.register('stage6ProfilerTest', JavaExec) {
    group = 'verification'
    description = 'Checks Stage 6 aggregate profiler percentile and reset behavior.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nexusmc.landscape.diagnostics.Stage6ProfilerSelfTest'
    environment 'NEXUS_LANDSCAPE_PROFILE', '1'
}

tasks.register('surfaceNoiseTest', JavaExec) {
    group = 'verification'
    description = 'Checks deterministic surface noise, range and scale validation.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nexusmc.landscape.worldgen.v2.surface.SurfaceNoiseSelfTest'
}

tasks.register('surfaceSelectionTest', JavaExec) {
    group = 'verification'
    description = 'Checks surface selection identity, palette, weight and depth invariants.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nexusmc.landscape.worldgen.v2.surface.SurfaceSelectionSelfTest'
}

tasks.register('surfaceContextTest', JavaExec) {
    group = 'verification'
    description = 'Checks normalized surface context inputs and derived zone flags.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nexusmc.landscape.worldgen.v2.surface.SurfaceContextSelfTest'
}

tasks.register('surfaceProfileInvariantTest', JavaExec) {
    group = 'verification'
    description = 'Checks surface profile traits, palettes and immutable data invariants.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nexusmc.landscape.worldgen.v2.surface.SurfaceProfileInvariantSelfTest'
}

tasks.register('climateRouterRangeTest', JavaExec) {
    group = 'verification'
    description = 'Checks that climate router resources retain hot, cold, wet and dry reachability.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nexusmc.landscape.worldgen.v2.field.ClimateRouterRangeSelfTest'
}

tasks.named('check') {
    dependsOn regionalFieldTest, stage6SurfaceTest, stage6VegetationTest,
        stage6CommandTest, boundedCacheTest, stage6ProfilerTest,
        surfaceNoiseTest, surfaceSelectionTest, surfaceContextTest,
        surfaceProfileInvariantTest, climateRouterRangeTest
}
