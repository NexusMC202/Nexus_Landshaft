    description = 'Runs the deterministic 0.8.0-alpha.3 worldgen integration contract.'
    dependsOn climateRouterRangeTest, biomeReachabilityTest, regionalFieldTest,
        stage6SurfaceTest, surfaceProfileInvariantTest,
